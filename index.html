<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BMONI Embedded — money infrastructure console. Wallets, ledger, KYC, rails, funding and money movement." />
    <title>BMONI Embedded — Money Infrastructure Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23122921'/%3E%3Cpath d='M10 8h8.5a4 4 0 0 1 0 8H10zm0 8h10a4 4 0 0 1 0 8H10z' fill='none' stroke='%23E8B25C' stroke-width='2.4'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* boot guard: if the app bundle never mounts (blocked/404'd assets),
         surface a readable message instead of a blank page */
      window.addEventListener("load", function () {
        setTimeout(function () {
          var r = document.getElementById("root");
          if (r && r.childElementCount === 0) {
            r.innerHTML =
              '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#122921;color:#f0f5ef;font-family:ui-monospace,monospace;padding:24px;text-align:center">' +
              '<div><p style="font-size:18px;font-weight:700;margin:0 0 8px">BMONI Embedded — bundle did not load</p>' +
              '<p style="font-size:13px;color:#9db3a5;margin:0 0 16px">The app script was blocked or not found. Serve the built <b>dist/</b> folder over HTTP (e.g. <b>npm run preview</b>) rather than opening index.html directly, then hard-refresh.</p>' +
              '<button onclick="location.reload()" style="background:#c9862f;color:#241703;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer">Retry</button></div></div>';
          }
        }, 2500);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
